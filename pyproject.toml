[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-rescue"
version = "0.1.0"
description = "DJI Tello indoor search and rescue prototype"
requires-python = ">=3.10"
dependencies = [
    "djitellopy>=2.5.0",
    "opencv-python>=4.9.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "Pillow>=10.0.0",
]

[project.scripts]
drone-rescue = "drone_rescue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
